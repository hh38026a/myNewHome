<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Member Form</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>New Member Form</h1>
  <hr>

  <form>
    <label for="name">Name</label>
    <input type="text" id="name" name="name" autocomplete="name" required>

    <fieldset>
      <legend>Gender</legend>
      <label><input type="radio" name="gender" value="female" required> Female</label>
      <label><input type="radio" name="gender" value="male"> Male</label>
      <label><input type="radio" name="gender" value="other"> Other</label>
      <label><input type="radio" name="gender" value="prefer-not-to-say"> Prefer not to say</label>
    </fieldset>

    <label for="birth">Day of birth</label>
    <input type="date" id="birth" name="birth" autocomplete="bday" required>

    <label for="address">Address</label>
    <textarea id="address" name="address" rows="3" autocomplete="street-address" required></textarea>

    <label for="mobile">Mobile</label>
    <input type="tel" id="mobile" name="mobile" autocomplete="tel" required>

    <button type="submit">Submit</button>
  </form>
</body>

</html>
