<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Table</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Time Table</h1>
  <hr>

  <table>
    <thead>
      <tr>
        <th scope="col"></th>
        <th scope="col">Mon</th>
        <th scope="col">Wed</th>
        <th scope="col">Fri</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">AM</th>
        <td>Word</td>
        <td></td>
        <td></td>
      </tr>
      <tr>
        <th scope="row">PM</th>
        <td>Excel</td>
        <td></td>
        <td></td>
      </tr>
      <tr>
        <th scope="row">OT</th>
        <td></td>
        <td>TV</td>
        <td>TV</td>
      </tr>
    </tbody>
  </table>
</body>

</html>
